# virtuallyView: download VPN with NO account. See docs/privacy.md.
#
# Uses VPN Gate (an open academic project, University of Tsukuba): free public
# relays run by volunteers, no sign-up. Each start picks the best available
# relay. Honest limits: relays are volunteers and VPN Gate keeps connection
# logs, so this hides your downloads from your internet provider but is NOT
# anonymity, and speed varies. For a paid, audited provider (Mullvad, Proton,
# IVPN, AirVPN...) use docker-compose.vpn.yml with your own WireGuard key.
#
#   docker compose -f docker-compose.yml -f docker-compose.vpn-free.yml up -d
# Verify: docker exec appletvopensourcce-vpn-1 wget -qO- ifconfig.me   (not your home IP)
# Back to no VPN: docker compose up -d --force-recreate qbittorrent
# Pick a country: VPN_SERVER_COUNTRY_CODE=NL (two-letter code) in .env.
services:
  vpngate-config:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/vpngate.mjs", "/gluetun/custom.ovpn", "--watch"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - VPN_SERVER_COUNTRY_CODE=${VPN_SERVER_COUNTRY_CODE:-}
    volumes:
      - gluetun-config:/gluetun
    # Stays running: swaps in a fresh relay when the current one goes away.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-s", "/gluetun/custom.ovpn"]
      interval: 5s
      timeout: 3s
      retries: 30

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: appletvopensourcce-vpn-1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.ovpn
      - OPENVPN_USER=vpn
      - OPENVPN_PASSWORD=vpn
      # Some free relays block DNS-over-TLS (port 853) and the tunnel then looks dead. DNS-over-HTTPS uses port 443.
      - DNS_UPSTREAM_RESOLVER_TYPE=DoH
      # Cloudflare's DoH alone (the gluetun default) regularly timed out from these VPN Gate exit IPs
      # (likely rate-limited/blocked as a known abuse source) - every tracker and DHT bootstrap hostname
      # failed to resolve, so torrents found zero peers even though the tunnel itself worked fine. Listing
      # several providers lets gluetun fail over to whichever one this exit IP can actually reach.
      - DNS_UPSTREAM_RESOLVERS=cloudflare,google,quad9
      - FIREWALL_OUTBOUND_SUBNETS=10.89.0.0/16,172.16.0.0/12
      - FIREWALL_INPUT_PORTS=8888
      # gluetun's own web proxy: Prowlarr sends its searches through it (never published outside the compose network).
      - HTTPPROXY=on
    volumes:
      - gluetun-config:/gluetun
    depends_on:
      vpngate-config:
        condition: service_healthy
    # No "qbittorrent" network alias here any more: qBittorrent left this VPN's network, and the leftover alias made
    # the name resolve to two containers (confirmed live), so Radarr/Sonarr/the app reached the VPN instead about
    # half the time and grabs or download status failed at random.
    restart: unless-stopped
    healthcheck:
      # gluetun's own check (it tests the tunnel itself). The old probe fetched https://ipinfo.io, which blocks
      # VPN Gate exit IPs: the container read "unhealthy" while searches went through it fine, confirmed live.
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # qBittorrent deliberately stays OFF the VPN overlay (keeps the base compose file's normal
  # networking - no override here at all): free VPN Gate relays volunteer-run OpenVPN tunnels pass
  # normal HTTPS fine but, confirmed live, gave 0 B/s and 0 DHT nodes on every relay tried (3 different
  # exit IPs, 2 countries) - the moment the VPN was removed, the same torrents hit several MB/s in
  # under a minute. Prowlarr's searches (and anything else using gluetun's HTTP proxy, HTTPPROXY=on
  # above) still go through the VPN; only the actual peer-to-peer transfer bypasses it, by request.

volumes:
  gluetun-config:
