services:
  # --- One-time config seeding (see docker/seed/README.md) ---
  # Each *-init container copies a pre-built config into that service's
  # volume only if it isn't there yet, so first boot needs no manual setup.

  radarr-init:
    image: alpine:3.20
    volumes:
      - ./docker/seed/radarr/config.xml:/seed/config.xml:ro
      - radarr-config:/config
    entrypoint: ["sh", "-c", "test -f /config/config.xml || cp /seed/config.xml /config/config.xml"]

  sonarr-init:
    image: alpine:3.20
    volumes:
      - ./docker/seed/sonarr/config.xml:/seed/config.xml:ro
      - sonarr-config:/config
    entrypoint: ["sh", "-c", "test -f /config/config.xml || cp /seed/config.xml /config/config.xml"]

  prowlarr-init:
    image: alpine:3.20
    volumes:
      - ./docker/seed/prowlarr/config.xml:/seed/config.xml:ro
      - prowlarr-config:/config
    entrypoint: ["sh", "-c", "test -f /config/config.xml || cp /seed/config.xml /config/config.xml"]

  lidarr-init:
    image: alpine:3.20
    volumes:
      - ./docker/seed/lidarr/config.xml:/seed/config.xml:ro
      - lidarr-config:/config
    entrypoint: ["sh", "-c", "test -f /config/config.xml || cp /seed/config.xml /config/config.xml"]

  bazarr-init:
    image: alpine:3.20
    volumes:
      - ./docker/seed/bazarr/config.yaml:/seed/config.yaml:ro
      - bazarr-config:/config
    entrypoint: ["sh", "-c", "mkdir -p /config/config && test -f /config/config/config.yaml || cp /seed/config.yaml /config/config/config.yaml"]

  qbittorrent-init:
    image: alpine:3.20
    volumes:
      - ./docker/seed/qbittorrent/qBittorrent.conf:/seed/qBittorrent.conf:ro
      - qbittorrent-config:/config
    entrypoint: ["sh", "-c", "mkdir -p /config/qBittorrent && test -f /config/qBittorrent/qBittorrent.conf || cp /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf"]

  # Makes the folders NZBGet reports to the *arr apps, so their health checks
  # do not warn about a missing path before the first Usenet download.
  downloads-init:
    image: alpine:3.20
    volumes:
      - downloads:/downloads
    entrypoint: ["sh", "-c", "mkdir -p /downloads/completed/Movies /downloads/completed/Series /downloads/completed/Music"]

  # --- The *arr stack, a download client, and a media server ---

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    depends_on:
      radarr-init:
        condition: service_completed_successfully
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - radarr-config:/config
      - media-movies:/media/movies
      - downloads:/downloads
    ports:
      - "127.0.0.1:7878:7878"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=X-Api-Key: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4", "http://localhost:7878/api/v3/system/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    depends_on:
      sonarr-init:
        condition: service_completed_successfully
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - sonarr-config:/config
      - media-tv:/media/tv
      - downloads:/downloads
    ports:
      - "127.0.0.1:8989:8989"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=X-Api-Key: b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5", "http://localhost:8989/api/v3/system/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    depends_on:
      prowlarr-init:
        condition: service_completed_successfully
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - prowlarr-config:/config
    ports:
      - "127.0.0.1:9696:9696"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=X-Api-Key: c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6", "http://localhost:9696/api/v1/system/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    depends_on:
      lidarr-init:
        condition: service_completed_successfully
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - lidarr-config:/config
      - media-music:/media/music
      - downloads:/downloads
    ports:
      - "127.0.0.1:8686:8686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=X-Api-Key: d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1", "http://localhost:8686/api/v1/system/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    depends_on:
      bazarr-init:
        condition: service_completed_successfully
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - bazarr-config:/config
      - media-movies:/media/movies
      - media-tv:/media/tv
    ports:
      - "127.0.0.1:6767:6767"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    depends_on:
      qbittorrent-init:
        condition: service_completed_successfully
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent-config:/config
      - downloads:/downloads
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6881:6881"
      - "127.0.0.1:6881:6881/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v2/app/webapiVersion"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    depends_on:
      downloads-init:
        condition: service_completed_successfully
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
      - NZBGET_USER=${NZBGET_USERNAME:-nzbget}
      - NZBGET_PASS=${NZBGET_PASSWORD:-nzbget}
    volumes:
      - nzbget-config:/config
      - downloads:/downloads
    ports:
      - "127.0.0.1:6789:6789"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # One-shot: wires Radarr/Sonarr/Lidarr to qBittorrent and to Prowlarr.
  provision:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/provision-stack.mjs"]
    environment:
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6
      - PROWLARR_AUTO_INDEXERS=${PROWLARR_AUTO_INDEXERS:-all-public}
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - SEARCH_VIA_TOR=${SEARCH_VIA_TOR:-false}
      - LIDARR_URL=http://lidarr:8686
      - LIDARR_API_KEY=d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1
      - BAZARR_URL=http://bazarr:6767
      - BAZARR_API_KEY=${BAZARR_API_KEY:-e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2}
      - SUBTITLE_LANGUAGES=${SUBTITLE_LANGUAGES:-en}
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=adminadmin
      - NZBGET_URL=http://nzbget:6789
      - NZBGET_USERNAME=${NZBGET_USERNAME:-nzbget}
      - NZBGET_PASSWORD=${NZBGET_PASSWORD:-nzbget}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
      - DASHBOARD_AUTH_PASSWORD=${DASHBOARD_AUTH_PASSWORD:-}
      - DASHBOARD_AUTH_USERNAME=${DASHBOARD_AUTH_USERNAME:-root}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-120}
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      lidarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      nzbget:
        condition: service_started
      bazarr:
        condition: service_started
      flaresolverr:
        condition: service_started
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # 0.0.0.0 exposes the dashboard on every host interface so other devices on
    # the local network can reach it at http://<host-ip>:3000. The *arr stack,
    # download clients and Ollama stay bound to 127.0.0.1 (host-only).
    ports:
      - "0.0.0.0:3000:3000"
    # Public resolvers, like the other services: without this the app cannot
    # resolve TMDB/YouTube/MusicBrainz, so trailers, cast and covers all fail.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6
      - LIDARR_URL=http://lidarr:8686
      - LIDARR_API_KEY=d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1
      - BAZARR_URL=http://bazarr:6767
      - BAZARR_API_KEY=${BAZARR_API_KEY:-e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2}
      - QBITTORRENT_URL=http://qbittorrent:8080
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=adminadmin
      - NZBGET_URL=http://nzbget:6789
      - NZBGET_USERNAME=${NZBGET_USERNAME:-nzbget}
      - NZBGET_PASSWORD=${NZBGET_PASSWORD:-nzbget}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
      - SEARCH_VIA_TOR=${SEARCH_VIA_TOR:-false}
    volumes:
      - app-data:/app/apps/server/data
      - media-movies:/media/movies:ro
      - media-tv:/media/tv:ro
      - media-music:/media/music:ro
      - media-photos:/media/photos:ro
      - media-books:/media/books:ro
    depends_on:
      - radarr
      - sonarr
      - prowlarr
      - lidarr
      - qbittorrent
      - nzbget
      - bazarr
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Solves the Cloudflare checks some public search sources sit behind, so more
  # of them work. Prowlarr routes only the sources that need it through here.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # --- Other apps, each one command away: docker compose --profile <name> up -d ---
  # They keep their own logins and data. The Apps page finds them by itself.

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    profiles: ["audiobookshelf"]
    ports:
      - "${VV_APPS_BIND:-0.0.0.0}:13378:80"
    volumes:
      - audiobookshelf-config:/config
      - audiobookshelf-metadata:/metadata
      - audiobookshelf-books:/audiobooks
      - audiobookshelf-podcasts:/podcasts
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  kavita:
    image: jvmilazz0/kavita:latest
    profiles: ["kavita"]
    ports:
      - "${VV_APPS_BIND:-0.0.0.0}:5000:5000"
    volumes:
      - kavita-config:/kavita/config
      - media-books:/books:ro
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    profiles: ["immich"]
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:-immich-local-db}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - immich-upload:/data
      - media-photos:/usr/src/app/external/photos:ro
    ports:
      - "${VV_APPS_BIND:-0.0.0.0}:2283:2283"
    depends_on:
      - immich-redis
      - immich-postgres
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    profiles: ["immich"]
    volumes:
      - immich-model-cache:/cache
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  immich-redis:
    image: docker.io/valkey/valkey:8-bookworm
    profiles: ["immich"]
    restart: unless-stopped

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    profiles: ["immich"]
    environment:
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD:-immich-local-db}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - immich-db:/var/lib/postgresql/data
    restart: unless-stopped

  # Optional AI assistant (about 5 GB). Not started by default so the first
  # install is quick. Turn it on with: docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    # Public resolvers, like the *arr stack and app: without this, pulling a
    # model fails to resolve registry.ollama.ai on some Docker/Podman networks.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Optional Tor SOCKS5 proxy. No account or setup needed, unlike a VPN. Turn
  # it on with: docker compose --profile tor up -d
  # Then point Settings > Server > Outbound proxy at host "tor", port 9050,
  # and/or add it as a SOCKS5 indexer proxy in Prowlarr (Settings > Indexer
  # Proxies) with the same host and port, applied to the indexers you want
  # searched over Tor. See docs/privacy.md.
  tor:
    image: osminogin/tor-simple:latest
    profiles: ["tor"]
    ports:
      - "127.0.0.1:9050:9050"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9050"]
      interval: 15s
      timeout: 5s
      retries: 6
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Optional offline Wikipedia (and other wikis) reader. Downloads the libraries
  # listed in KIWIX_ZIMS (a small starter set by default) and serves them, more
  # appearing as each finishes. Or copy your own .zim files into the volume.
  # Turn it on with: docker compose --profile kiwix up -d
  # The Wiki page finds it by itself. See docs/kiwix.md.
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    profiles: ["kiwix"]
    entrypoint: ["/bin/sh", "/run.sh"]
    environment:
      # Libraries to download and keep (folder/name-prefix, newest picked). Small
      # by default; see docs/kiwix.md for the survival, medicine and full-Wikipedia packs.
      - KIWIX_ZIMS=${KIWIX_ZIMS:-wikipedia/wikipedia_en_all_mini wikibooks/wikibooks_en_all_nopic wikivoyage/wikivoyage_en_all_maxi other/appropedia_en_all_maxi other/zimgit-medicine_en other/zimgit-water_en}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - kiwix-data:/data
      - ./docker/kiwix/run.sh:/run.sh:ro
    ports:
      - "${VV_APPS_BIND:-0.0.0.0}:8888:8080"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Optional automatic updates for the containers above (only the ones
  # labeled com.centurylinklabs.watchtower.enable=true, so it never touches
  # anything else on this Docker host). Fully automatic: no confirmation
  # prompt, and no rollback if a new image misbehaves - if you want to review
  # updates first, don't turn this on and instead run
  # "docker compose pull && docker compose up -d" yourself when you choose.
  # Turn it on with: docker compose --profile auto-update up -d
  # See docs/updates.md, including the extra step rootless Podman needs.
  watchtower:
    image: containrrr/watchtower:latest
    profiles: ["auto-update"]
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_INTERVAL_SECONDS:-86400}
    restart: unless-stopped

volumes:
  radarr-config:
  sonarr-config:
  prowlarr-config:
  lidarr-config:
  bazarr-config:
  qbittorrent-config:
  nzbget-config:
  media-movies:
  media-tv:
  media-music:
  media-photos:
  media-books:
  downloads:
  app-data:
  ollama-data:
  kiwix-data:
  audiobookshelf-config:
  audiobookshelf-metadata:
  audiobookshelf-books:
  audiobookshelf-podcasts:
  kavita-config:
  immich-upload:
  immich-model-cache:
  immich-db:
